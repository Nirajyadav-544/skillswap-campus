<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>SkillSwap Campus Resume</title>

    <style>
        * {
            box-sizing: border-box;
        }

        @page {
            size: A4;
            margin: 18mm;
        }

        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            color: #222222;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            line-height: 1.5;
        }

        .resume {
            width: 100%;
            max-width: 794px;
            margin: 0 auto;
            background: #ffffff;
        }

        .header {
            padding-bottom: 18px;
            margin-bottom: 22px;
            border-bottom: 2px solid #222222;
        }

        .name {
            margin: 0;
            font-size: 30px;
            font-weight: 700;
        }

        .resume-title {
            margin-top: 5px;
            color: #555555;
            font-size: 16px;
        }

        .description {
            margin-top: 10px;
            color: #444444;
            white-space: pre-wrap;
        }

        .section {
            margin-top: 22px;
        }

        .section-title {
            margin: 0 0 10px 0;
            padding-bottom: 5px;
            border-bottom: 1px solid #bbbbbb;
            font-size: 17px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .content {
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .file-information {
            margin-top: 25px;
            padding-top: 12px;
            border-top: 1px solid #dddddd;
            color: #666666;
            font-size: 12px;
        }

        .file-information div {
            margin-bottom: 3px;
        }

        .footer {
            margin-top: 35px;
            padding-top: 10px;
            border-top: 1px solid #dddddd;
            color: #888888;
            font-size: 10px;
            text-align: center;
        }

        .page-break {
            page-break-before: always;
        }

        @media print {

            body {
                background: #ffffff;
            }

            .resume {
                max-width: none;
            }
        }
    </style>
</head>

<body>

<div class="resume">

    <header class="header">

        <h1 class="name">
            {{title}}
        </h1>

        <div class="resume-title">
            SkillSwap Campus Resume
        </div>

        <div class="description">
            {{description}}
        </div>

    </header>


    <section class="section">

        <h2 class="section-title">
            Resume
        </h2>

        <div class="content">
            {{extractedText}}
        </div>

    </section>


    <section class="section">

        <h2 class="section-title">
            Version Information
        </h2>

        <div class="content">

            Version Number:
            {{versionNumber}}

            Change Summary:
            {{changeSummary}}

        </div>

    </section>


    <section class="section">

        <h2 class="section-title">
            File Information
        </h2>

        <div class="file-information">

            <div>
                <strong>File Name:</strong>
                {{fileName}}
            </div>

            <div>
                <strong>File Type:</strong>
                {{fileType}}
            </div>

        </div>

    </section>


    <footer class="footer">

        SkillSwap Campus

    </footer>

</div>

</body>
</html>
