<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Resume</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            color: #222222;
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.5;
        }

        .resume {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px;
        }

        .header {
            border-bottom: 2px solid #222222;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .title {
            margin: 0;
            font-size: 32px;
            font-weight: 700;
        }

        .description {
            margin-top: 8px;
            color: #555555;
            font-size: 15px;
        }

        .section {
            margin-top: 25px;
        }

        .section-title {
            margin: 0 0 10px 0;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            border-bottom: 1px solid #cccccc;
            padding-bottom: 5px;
        }

        .content {
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 14px;
        }

        .meta {
            margin-top: 20px;
            color: #666666;
            font-size: 12px;
        }

        .footer {
            margin-top: 40px;
            padding-top: 15px;
            border-top: 1px solid #dddddd;
            color: #777777;
            font-size: 11px;
            text-align: center;
        }

        @media print {

            body {
                background: #ffffff;
            }

            .resume {
                max-width: none;
                padding: 20px;
            }

            .footer {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="resume">

    <header class="header">

        <h1 class="title">
            Resume
        </h1>

        <div class="description">
            Resume document generated by SkillSwap Campus
        </div>

    </header>

    <section class="section">

        <h2 class="section-title">
            Resume Content
        </h2>

        <div class="content">
            <!--
                Resume text can be inserted here by the export service.
            -->
            {{extractedText}}
        </div>

    </section>

    <section class="section">

        <h2 class="section-title">
            Version Information
        </h2>

        <div class="content">

            Version:
            {{versionNumber}}

            Title:
            {{title}}

            Description:
            {{description}}

        </div>

    </section>

    <div class="meta">

        File:
        {{fileName}}

        <br>

        File Type:
        {{fileType}}

    </div>

    <footer class="footer">

        SkillSwap Campus — Resume Management

    </footer>

</div>

</body>
</html>
