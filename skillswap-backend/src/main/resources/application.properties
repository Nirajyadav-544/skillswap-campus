# ==========================================
# Application
# ==========================================

spring.application.name=skillswap-backend
server.port=8080


# ==========================================
# MySQL
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/skillswap?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=982144


# ==========================================
# JPA
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# Gmail SMTP
# ==========================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${SKILLSWAP_MAIL_USERNAME}
spring.mail.password=${SKILLSWAP_MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# ==========================================
# SkillSwap Mail
# ==========================================

app.mail.from=${SKILLSWAP_MAIL_USERNAME}
app.mail.from-name=SkillSwap Campus


# ==========================================
# OTP
# ==========================================

app.otp.expiry-minutes=10


# ==========================================
# JWT
# ==========================================

app.jwt.secret=${SKILLSWAP_JWT_SECRET}
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000